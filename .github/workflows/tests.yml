name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast checks: builds the plugin and runs it against a stubbed plugin API for desktop and mobile.
  harness:
    name: Harness (desktop + mobile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Node 24 is the current LTS line; Node 20 went end-of-life in April 2026. 24 rather than 22
      # because 22 is already in maintenance and drops out of support in April 2027, and because
      # publish.yml has to run its registry-facing steps on 24 anyway (npm trusted publishing needs
      # >= 22.14) — building on 24 keeps every job on one runtime. Keep this in sync with the e2e job
      # below and with publish.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Real-app E2E: launches the actual Joplin desktop (Electron) under Xvfb with the plugin loaded.
  e2e:
    name: Real-app E2E (Playwright + Joplin desktop)
    needs: harness
    runs-on: ubuntu-24.04
    # A healthy run is well under this. Playwright's own globalTimeout (see playwright.config.ts) is
    # set below this cap so a stuck suite stops itself and still uploads its report/traces, rather
    # than being hard-cancelled here (a cancel skips the upload, which is why the first run left none).
    timeout-minutes: 20
    env:
      # Must be >= the plugin's manifest app_min_version. Keep in sync with scripts/setup-e2e.sh.
      JOPLIN_E2E_VERSION: 3.6.14
    steps:
      - uses: actions/checkout@v7

      # Same runtime as the harness job above — see the note there.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Electron is Chromium under the hood, so Playwright's chromium host deps cover Joplin too.
      # Also install Xvfb for the virtual display the GUI requires.
      - name: Install Electron/Chromium system dependencies + Xvfb
        run: |
          sudo npx playwright install-deps chromium
          sudo apt-get install -y xvfb

      # Cache the downloaded Joplin AppImage so reruns skip the ~150 MB download.
      # setup-e2e.sh re-extracts it (fast) when the squashfs-root is absent.
      - name: Cache Joplin AppImage
        uses: actions/cache@v6
        with:
          path: .e2e-cache/Joplin.AppImage
          key: joplin-appimage-${{ env.JOPLIN_E2E_VERSION }}

      # Builds the plugin (npm run dist), downloads + extracts Joplin (npm run setup:e2e),
      # then runs the Playwright suite under a virtual display (xvfb-run).
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report & traces
        # Always upload, including when the suite fails or the job hits its timeout — the traces are
        # the whole point of the artifact and are needed precisely when something went wrong.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
